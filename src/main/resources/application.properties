spring.application.name=salon-management-platform

# Datasource - local MySQL 8.0 (native service, not dockerized)
# Credentials come from environment variables, never committed to the repo.
spring.datasource.url=jdbc:mysql://localhost:3306/sms_db?serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=@Mayaba21435

# The local MySQL server defaults to REPEATABLE READ (shared with other apps, so we
# cannot change it server-wide). Pin READ COMMITTED per-connection for this pool only,
# as required by blueprint 2.6.
spring.datasource.hikari.connection-init-sql=SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED

# Schema management: auto-DDL in development (blueprint 1). Production pins 'validate' (phase 9).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT signing secret - MUST come from JWT_SECRET in production.
# The fallback below is for local development only and is deliberately insecure.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-prod-0123456789abcdef}
jwt.access-token-minutes=15
jwt.refresh-token-days=7

# Pagination caps (blueprint phase-3): unbounded findAll is banned.
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20
