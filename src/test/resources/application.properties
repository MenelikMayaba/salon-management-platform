# Tests target the dedicated sms_test schema on the local MySQL 8.0 instance.
# Integration tests are deferred per project decision (no Docker/Testcontainers);
# they are written against real MySQL - never H2 - and run when infrastructure is settled.
spring.datasource.url=jdbc:mysql://localhost:3306/sms_test?serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
