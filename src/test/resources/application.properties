# Tests target the dedicated sms_test schema on the local MySQL 8.0 instance.
# Never H2 (blueprint rule 13). Requires MySQL running locally - tests fail fast without it.
spring.datasource.url=jdbc:mysql://localhost:3306/sms_test?serverTimezone=UTC&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=@Mayaba21435
spring.datasource.hikari.connection-init-sql=SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Query-count assertions for N+1 regression tests (blueprint rule 15).
# Enabled in tests only - never in production, it has a small performance cost.
spring.jpa.properties.hibernate.generate_statistics=true

jwt.secret=test-secret-key-for-integration-tests-only-not-production
jwt.access-token-minutes=15
jwt.refresh-token-days=7

spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20
